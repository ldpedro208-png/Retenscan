<!-- Listado de carreras de la universidad -->
{% extends 'layout/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-mortarboard"></i> Carreras</h1>
    <a href="{% url 'carrera_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Nueva Carrera
    </a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Código</th>
                    <th>Duración</th>
                    <th>Estudiantes</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for carrera in carreras %}
                <tr>
                    <td>{{ carrera.nombre }}</td>
                    <td>{{ carrera.codigo }}</td>
                    <td>{{ carrera.duracion_semestres }} semestres</td>
                    <td>{{ carrera.estudiantes.count }}</td>
                    <td>
                        <a href="{% url 'carrera_edit' carrera.idCarrera %}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="{% url 'carrera_delete' carrera.idCarrera %}" class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
