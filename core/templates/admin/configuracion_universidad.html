{% extends 'layout/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-gear"></i> Configuración - {{ universidad.nombre }}</h1>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5>Información General</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Nombre de la Universidad</label>
                        <input type="text" class="form-control" value="{{ universidad.nombre }}" name="nombre">
                    </div>
                    <div class="mb-3">
                        <label>País</label>
                        <input type="text" class="form-control" value="{{ universidad.pais }}" name="pais">
                    </div>
                    <div class="mb-3">
                        <label>Ciudad</label>
                        <input type="text" class="form-control" value="{{ universidad.ciudad }}" name="ciudad">
                    </div>
                    <div class="mb-3">
                        <label>Tipo</label>
                        <select class="form-select" name="tipo">
                            <option value="Publica" {% if universidad.tipo == 'Publica' %}selected{% endif %}>Pública</option>
                            <option value="Privada" {% if universidad.tipo == 'Privada' %}selected{% endif %}>Privada</option>
                            <option value="Mixta" {% if universidad.tipo == 'Mixta' %}selected{% endif %}>Mixta</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5>Administradores de Universidad</h5>
            </div>
            <div class="card-body">
                <div class="list-group">
                    {% for admin in admins_universidad %}
                    <div class="list-group-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>{{ admin.username }}</strong>
                                <br>
                                <small class="text-muted">{{ admin.email }}</small>
                            </div>
                            <span class="badge bg-primary">Admin</span>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                <div class="mt-3">
                    <a href="{% url 'usuario_create' %}?rol=admin" class="btn btn-primary">
                        <i class="bi bi-person-plus"></i> Agregar Administrador
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
