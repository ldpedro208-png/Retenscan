{% extends 'layout/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-upload"></i> Importar Datos</h1>
</div>

<div class="card">
    <div class="card-body">
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i>
            Importa datos masivos para tu universidad.
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label>Tipo de Importación</label>
                <select class="form-select" name="tipo_importacion">
                    <option value="estudiantes">Estudiantes</option>
                    <option value="profesores">Profesores</option>
                    <option value="tutores">Tutores</option>
                    <option value="materias">Materias</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Archivo (CSV/Excel)</label>
                <input type="file" class="form-control" name="archivo" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="actualizar" id="actualizar">
                <label class="form-check-label" for="actualizar">Actualizar registros existentes</label>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-upload"></i> Importar
            </button>
        </form>
    </div>
</div>
{% endblock %}
