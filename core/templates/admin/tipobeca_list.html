{% extends 'layout/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-award"></i> Tipos de Beca</h1>
    <a href="{% url 'tipobeca_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Nuevo Tipo de Beca
    </a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for tipobeca in tipobecas %}
                <tr>
                    <td>{{ tipobeca.nombre }}</td>
                    <td>{{ tipobeca.descripcion|truncatechars:50 }}</td>
                    <td>
                        <a href="{% url 'tipobeca_edit' tipobeca.idTipoBeca %}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="{% url 'tipobeca_delete' tipobeca.idTipoBeca %}" class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
