{% extends 'layout/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-book"></i> Materias</h1>
    <a href="{% url 'materia_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Nueva Materia
    </a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Código</th>
                    <th>Carrera</th>
                    <th>Créditos</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for materia in materias %}
                <tr>
                    <td>{{ materia.nombre }}</td>
                    <td>{{ materia.codigo }}</td>
                    <td>{{ materia.idCarrera.nombre }}</td>
                    <td>{{ materia.creditos }}</td>
                    <td>
                        <a href="{% url 'materia_edit' materia.idMateria %}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="{% url 'materia_delete' materia.idMateria %}" class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
