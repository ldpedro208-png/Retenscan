<!-- templates/admin/usuario_update.html -->
{% extends 'layout/base.html' %}
{% load static %}

{% block title %}Editar Usuario - RetenScan{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-pencil-square"></i> Editar Usuario</h1>
        <a href="{% url 'usuario_list' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre de usuario</label>
                        <input type="text" class="form-control" value="{{ usuario.username }}" disabled>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Carnet</label>
                        <input type="text" class="form-control" value="{{ usuario.carnet }}" disabled>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="first_name" class="form-control" value="{{ usuario.first_name }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" name="last_name" class="form-control" value="{{ usuario.last_name }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ usuario.email }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ usuario.telefono }}">
                    </div>
                </div>

                <div class="mb-3">
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" 
                               {% if usuario.is_active %}checked{% endif %}>
                        <label class="form-check-label">Usuario activo</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <input type="text" class="form-control" value="{{ usuario.get_rol_display }}" disabled>
                    <small class="text-muted">El rol no se puede cambiar desde aquí.</small>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar cambios
                    </button>
                    <a href="{% url 'usuario_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
